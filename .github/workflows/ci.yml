name: CI

# Alle Jobs laufen auf self-hosted Runnern, nicht auf GitHub-hosted.
# Voraussetzung: mindestens ein self-hosted macOS-Runner mit Xcode 26 und git.
# Die Labels unten an die eigene Runner-Registrierung anpassen. Wer einen eigenen
# self-hosted Linux-Runner hat, kann den Guardrails-Job auf [self-hosted, Linux]
# umstellen, das Skript laeuft auf beiden.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Konventionen und Guardrails
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Guardrails ausfuehren
        run: bash scripts/ci/guardrails.sh

  build:
    name: iOS-Build (Simulator)
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Xcode waehlen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Braucht Xcode 26 fuer die iOS-26-SDK (SpeechAnalyzer, Foundation Models).
          xcode-version: latest-stable
      - name: Xcode-Version anzeigen
        run: xcodebuild -version
      - name: Bauen fuer iOS-Simulator
        run: |
          xcodebuild build \
            -project ATCRadioText.xcodeproj \
            -scheme ATCRadioText \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
