name: CI

# Alle Jobs laufen auf self-hosted Runnern, nicht auf GitHub-hosted.
# Verteilung:
#   guardrails: self-hosted Linux, zum Beispiel der Root-Server.
#   build:      self-hosted macOS mit Xcode 26. Ein iOS-Build braucht macOS,
#               ein Linux-Server kann ihn nicht kompilieren.
# Labels an die eigene Runner-Registrierung anpassen.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Konventionen und Guardrails
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v7
      - name: Guardrails ausfuehren
        run: bash scripts/ci/guardrails.sh

  build:
    name: iOS-Build (Simulator)
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v7
      - name: Xcode waehlen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Braucht Xcode 26 fuer die iOS-26-SDK (SpeechAnalyzer, Foundation Models).
          xcode-version: latest-stable
      - name: Xcode-Version anzeigen
        run: xcodebuild -version
      - name: Bauen fuer iOS-Simulator
        run: |
          xcodebuild build \
            -project ATCRadioText.xcodeproj \
            -scheme ATCRadioText \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
